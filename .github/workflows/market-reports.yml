# 自动生成市场报告（免费，GitHub 帮你定时跑）
# 每 15 分钟检查一次；到了开市 / 午休 / 收市报告时间就生成，
# 存进 reports/ 文件夹（网站会读取），并推送到你的 Telegram。

name: 市场报告

on:
  schedule:
    # UTC 时间，星期一到五。涵盖大马/印尼（UTC 1-10 点）和美股（UTC 13-22 点）
    # 避开整点（GitHub 在整点最忙，最容易延迟或丢掉任务）
    - cron: "7,22,37,52 1-10,13-22 * * 1-5"
  workflow_dispatch:        # 也可以在 GitHub 网页上手动按"Run workflow"
    inputs:
      market:
        description: "市场 bursa / idx / us（留空 = 自动判断）"
        required: false
      session:
        description: "时段 open / midday / close"
        required: false
        default: close

permissions:
  contents: write           # 允许把报告存回 repo

concurrency:
  group: market-reports
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装工具包
        run: pip install yfinance pandas requests python-dotenv openai pyyaml

      - name: 生成报告
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_MARKETS: ${{ vars.SCAN_MARKETS || 'bursa,idx,us' }}
          PANEL_DAILY: ${{ vars.PANEL_DAILY || 'bursa:3,idx:1,us:1' }}
          UNIVERSE_SIZE: ${{ vars.UNIVERSE_SIZE || 'bursa:250,idx:100,us:150' }}
          QUARTERLY_AI: ${{ vars.QUARTERLY_AI || '3' }}
        run: |
          if [ -n "${{ github.event.inputs.market }}" ]; then
            python scanner.py --market "${{ github.event.inputs.market }}" --session "${{ github.event.inputs.session }}"
          else
            python scanner.py --due
          fi

      - name: 保存报告到 repo
        if: always()   # 就算上一步有市场出错，已经做好的报告也要保存
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "没有新报告"
          else
            git commit -m "市场报告 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
